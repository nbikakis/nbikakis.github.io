          // ΕΛΛΗΝΙΚΑ
          elTitle: "Επεξηγήσιμη και Δικαια Τεχνητή Νοημοσύνη στα Συστήματα Συστάσεων",
          elDescription: "Τα συστήματα συστάσεων (recommender systems) αποτελούν σημαντική εφαρμογή της Τεχνητής Νοημοσύνης (AI) και της μηχανικής μάθησης και έχουν σχεδιαστεί ώστε να προτείνουν στους χρήστες σχετικό περιεχόμενο, προϊόντα ή υπηρεσίες με βάση τις προτιμήσεις τους, τη συμπεριφορά τους ή τις ομοιότητές τους με άλλους χρήστες. Χρησιμοποιούνται ευρέως σε πλατφόρμες όπως το Netflix, το Spotify, το YouTube, το Amazon και τα κοινωνικά δίκτυα, όπου βοηθούν τους χρήστες να ανακαλύπτουν ταινίες, μουσική, προϊόντα ή αναρτήσεις που είναι πιθανό να τους ενδιαφέρουν. Για παράδειγμα, ένα σύστημα συστάσεων ταινιών μπορεί να προτείνει μια ταινία επειδή ο χρήστης έχει παρακολουθήσει ταινίες παρόμοιων ειδών ή επειδή χρήστες με παρόμοιες προτιμήσεις την αξιολόγησαν θετικά. Η παρούσα διπλωματική εργασία διερευνά την επεξηγησιμότητα και τη δικαιοσύνη στα συστήματα συστάσεων, εστιάζοντας σε μεθόδους που καθιστούν τις αποφάσεις των συστημάτων περισσότερο διαφανείς, περιορίζοντας παράλληλα πιθανές μεροληψίες απέναντι σε χρήστες ή προτεινόμενα αντικείμενα. Η διπλωματική εργασία θα εξετάσει τεχνικές επεξηγήσιμης και δικαιας τεχνητής νοημοσύνης (Explainable AI and AI fairness) σε συστηματα συστάσεων, αξιολογώντας κατά πόσο μπορούν να παρέχουν κατανοητές αιτιολογήσεις για τις συστάσεις και να περιορίζουν την άνιση μεταχείριση διαφορετικών ομάδων.",
		  
          enKeywords: ["Explainable AI", "AI fairness", "Recommender Systems" ],
          elKeywords: ["Επεξηγήσιμη Τεχνητή Νοημοσύνη", "Δικαια Τεχνητή Νοημοσύνη", "Συστήματα Συστάσεων"]
        }
		
		
		
      ]
    };

    
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderIdentity() {
      const p = CONTENT.personal;

      document.getElementById("identity").innerHTML = `
        <a class="identity-name"
           href="${escapeHtml(p.homepage)}"
           target="_blank"
           rel="noopener noreferrer">
          ${escapeHtml(p.name)}
        </a>

        <span class="identity-sep">·</span>

        <a class="identity-email"
           href="mailto:${escapeHtml(p.email)}">
          ${escapeHtml(p.email)}
        </a>
     `;
    }

    function renderTopics(lang) {
      const isGreek = lang === "el";

      const pageTitle = isGreek
        ? CONTENT.page.elTitle
        : CONTENT.page.enTitle;

      const topicsHeading = isGreek
        ? CONTENT.page.elTopicsHeading
        : CONTENT.page.enTopicsHeading;

      document.documentElement.lang = lang;
      document.title = pageTitle;

      document.getElementById("page-title").textContent = pageTitle;
      document.getElementById("topics-heading").textContent = topicsHeading;

      document.getElementById("topics-list").innerHTML =
        CONTENT.topics.map((topic, index) => {
          const number = String(index + 1).padStart(2, "0");

          const title = isGreek
            ? topic.elTitle
            : topic.enTitle;

          const description = isGreek
            ? topic.elDescription
            : topic.enDescription;

          const keywords = isGreek
            ? topic.elKeywords
            : topic.enKeywords;

          const tags = keywords
            .map(keyword => `<span class="tag">${escapeHtml(keyword)}</span>`)
            .join("");

          return `
            <article class="topic">
              <div class="topic-number">${number}</div>
              <h3>${escapeHtml(title)}</h3>
              <p class="description">${escapeHtml(description)}</p>
              <div class="keywords">${tags}</div>
            </article>
          `;
        }).join("");

      document.querySelectorAll(".lang-btn").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.lang === lang
        );
      });

      try {
        localStorage.setItem("preferredLanguage", lang);
      } catch (error) {
        /* storage unavailable */
      }
    }

    function renderFooter() {
      const p = CONTENT.personal;

      document.getElementById("footer-content").innerHTML = `
        <div class="footer-contact">
          <a href="${escapeHtml(p.homepage)}"
             target="_blank"
             rel="noopener noreferrer">
            ${escapeHtml(p.name)}
          </a>

          <span class="footer-sep">·</span>

          <a href="mailto:${escapeHtml(p.email)}">
            ${escapeHtml(p.email)}
          </a>

          <span class="footer-sep">·</span>
          <span>${escapeHtml(p.department)}</span>

          <span class="footer-sep">·</span>
          <span>${escapeHtml(p.institution)}</span>
        </div>

        <div>© ${escapeHtml(p.year)}</div>
      `;
    }

    document.querySelectorAll(".lang-btn").forEach(button => {
      button.addEventListener("click", () => {
        renderTopics(button.dataset.lang);
      });
    });

    renderIdentity();
    renderFooter();

    let savedLanguage = null;
    try {
      savedLanguage = localStorage.getItem("preferredLanguage");
    } catch (error) {
      savedLanguage = null;
    }

    renderTopics(savedLanguage === "el" ? "el" : "en");
  </script>

</body>
</html>
